name: CI / Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # CHECK
  # ============================================================
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

  # ============================================================
  # VERSION
  # ============================================================
  version:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.new_tag || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag release
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  # ============================================================
  # BUILD
  # ============================================================
  build:
    needs: version
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [server, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/introw-${{ matrix.app }}:${{ needs.version.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/introw-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        env:
          ENV_DOCKER: ${{ secrets.ENV_DOCKER }}
          IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ needs.version.outputs.tag }}

          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          APP_PATH: ${{ secrets.APP_PATH }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          envs: ENV_DOCKER,IMAGE_PREFIX,IMAGE_TAG,DOCKER_USERNAME,DOCKER_TOKEN,GH_REPO,GH_TOKEN,APP_PATH

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            mkdir -p "$APP_PATH"
            cd "$APP_PATH"

            echo "Current directory:"
            pwd

            # ==================================================
            # DOCKER COMPOSE
            # ==================================================

            echo "Checking Docker Compose..."

            docker compose version

            # ==================================================
            # UPDATE REPOSITORY
            # ==================================================

            echo "Pulling repo from GitHub..."

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

            if [ ! -d ".git" ]; then
              echo "Initializing repository..."

              git init -q
              git remote add origin "https://github.com/${GH_REPO}.git"
            fi

            git fetch "$REPO_URL" main
            git reset --hard FETCH_HEAD

            echo "Current commit:"

            git log -1 --oneline

            # ==================================================
            # ENVIRONMENT
            # ==================================================

            echo "Writing production environment..."

            # Runtime environment used by containers
            printf '%s\n' "$ENV_DOCKER" > .env.docker
            chmod 600 .env.docker

            # Variables used by docker-compose.yml
            printf 'IMAGE_PREFIX=%s\n' "$IMAGE_PREFIX" > .env
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            chmod 600 .env

            # ==================================================
            # DOCKER HUB
            # ==================================================

            echo "Logging in to Docker Hub..."

            printf '%s' "$DOCKER_TOKEN" | \
              docker login \
                --username "$DOCKER_USERNAME" \
                --password-stdin

            # ==================================================
            # PULL APPLICATION IMAGES
            # ==================================================

            echo "Pulling Docker images..."

            docker compose pull server web

            # ==================================================
            # POSTGRES
            # ==================================================

            echo "Ensuring PostgreSQL is running..."

            docker compose up -d postgres

            # ==================================================
            # DEPLOY APPLICATION
            # ==================================================

            echo "Deploying application containers..."

            if ! docker compose up -d --no-deps --wait server web; then
              echo "======================================"
              echo "Deployment failed"
              echo "======================================"

              echo "Recent server logs:"
              docker compose logs --tail=100 server

              echo "Recent web logs:"
              docker compose logs --tail=100 web

              docker logout || true

              exit 1
            fi

            # ==================================================
            # NGINX
            # ==================================================

            echo "Installing Nginx configuration..."

            sudo cp \
              "$APP_PATH/nginx/nginx.conf" \
              /etc/nginx/sites-available/introw.conf

            echo "Enabling Nginx site..."

            sudo ln -sfn \
              /etc/nginx/sites-available/introw.conf \
              /etc/nginx/sites-enabled/introw.conf

            echo "Removing default Nginx site..."

            sudo rm -f \
              /etc/nginx/sites-enabled/default

            echo "Testing Nginx configuration..."

            sudo nginx -t

            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            # ==================================================
            # CLEANUP
            # ==================================================

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "Logging out of Docker Hub..."

            docker logout || true

            # ==================================================
            # STATUS
            # ==================================================

            echo "Deployment status:"

            docker compose ps

            echo "======================================"
            echo "Deployment complete"
            echo "======================================"
